<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pergunta</title>

    <style>
        .coracao {
            position: fixed;
            bottom: -50px;
            font-size: 30px;
            pointer-events: none;
            animation: subir 3s linear forwards;
            z-index: 1000;
        }

         @keyframes subir {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) scale(1.5);
                opacity: 0;
            }
        }
        
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: #75413f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .caixa {
            width: 500px;
            height: 300px;
            background-color: #e4eaf9;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #75413f;
            margin-bottom: 50px;
            text-align: center;
        }

        .botoes {
            display: flex;
            gap: 30px;
            align-items: center;
            justify-content: center;
        }

        button {
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        #sim {
            background-color: #75413f;
            color: white;
        }

        #sim:hover {
            transform: scale(1.08);
        }

        #nao {
            background-color: #999;
            color: white;
            position: relative;
        }
    </style>
</head>

<body>

    <div class="caixa" id="caixa">

        <h1>você vai me dar...? ❤️</h1>

        <div class="botoes">
            <button id="sim">Sim</button>
            <button id="nao">Não</button>
        </div>

    </div>

    <script>
        const botaoNao = document.getElementById("nao");
const caixa = document.getElementById("caixa");

let mouseX = 0;
let mouseY = 0;

// Guarda a posição do mouse
caixa.addEventListener("mousemove", function(event) {
    const rect = caixa.getBoundingClientRect();

    mouseX = event.clientX - rect.left;
    mouseY = event.clientY - rect.top;
});

botaoNao.addEventListener("mouseenter", fugir);

function fugir() {

    botaoNao.style.position = "absolute";

    const larguraCaixa = caixa.clientWidth;
    const alturaCaixa = caixa.clientHeight;

    const larguraBotao = botaoNao.offsetWidth;
    const alturaBotao = botaoNao.offsetHeight;

    // Distância mínima que o botão precisa ficar do mouse
    const distanciaMinima = 120;

    let novaPosicaoX;
    let novaPosicaoY;

    let distancia;

    // Tenta encontrar uma posição distante
    do {

        novaPosicaoX = Math.random() * (larguraCaixa - larguraBotao);
        novaPosicaoY = Math.random() * (alturaCaixa - alturaBotao);

        const centroBotaoX = novaPosicaoX + larguraBotao / 2;
        const centroBotaoY = novaPosicaoY + alturaBotao / 2;

        const diferencaX = centroBotaoX - mouseX;
        const diferencaY = centroBotaoY - mouseY;

        distancia = Math.sqrt(
            diferencaX * diferencaX +
            diferencaY * diferencaY
        );

    } while (distancia < distanciaMinima);

    botaoNao.style.left = novaPosicaoX + "px";
    botaoNao.style.top = novaPosicaoY + "px";
        }

        // Quando clicar em SIM
        document.getElementById("sim").addEventListener("click", function() {

    alert("Beijinhos "<br>"Eu sabia! ❤️"<br>"vou aproveitar bem);

    // Cria vários corações
    for (let i = 0; i < 30; i++) {

        const coracao = document.createElement("div");

        coracao.classList.add("coracao");
        coracao.innerHTML = "❤️";

        // Posição horizontal aleatória
        coracao.style.left = Math.random() * 100 + "vw";

        // Tamanho aleatório
        coracao.style.fontSize = (20 + Math.random() * 35) + "px";

        // Velocidade aleatória
        coracao.style.animationDuration = (2 + Math.random() * 2) + "s";

        document.body.appendChild(coracao);

        // Remove depois da animação
        setTimeout(() => {
            coracao.remove();
        }, 4000);
     }
        });
    </script>

</body>
</html>
